# Playwright E2E suite, run inside the Docker image we build from the Dockerfile.
# Manual trigger only: start it from the Actions tab with "Run workflow".
# The image carries Node, the browsers and BASE_URL, so the runner only needs Docker.

name: Playwright in Docker

on:
  workflow_dispatch:

jobs:
  test:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Buildx gives us a builder that can read and write an external layer cache.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # build-push-action wires up the GitHub Actions cache token for us, which a
      # raw "docker buildx build" run step does not get.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sd-e2e:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the tests in the container
        run: docker run --rm -v "${{ github.workspace }}/reports:/sd-e2e/playwright-report" sd-e2e:ci

      - name: Upload the report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/
          retention-days: 7
