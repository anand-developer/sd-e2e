# Playwright E2E suite for saucedemo.com — manual trigger only.
# Prerequisites:
#   - package-lock.json must be committed (npm ci needs it).
#   - baseURL is driven by the base_url input; falls back to saucedemo.com locally.

name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'No of parallel test runs'
        required: true
        default: '2'
        type: string
      tags:
        description: 'Tags'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '@smoke'
          - '@regression'
      base_url:
        description: 'Dashboard URL'
        required: true
        default: 'https://www.saucedemo.com'
        type: choice
        options:
          - 'https://www.saucedemo.com'
          - 'https://www.saucedemo.com'
      retention_days:
        description: 'Report retention (days)'
        required: true
        default: '1'
        type: string
      timeout:
        description: 'Job timeout (minutes)'
        required: true
        default: '60'
        type: string

jobs:
  test:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          TAGS="${{ github.event.inputs.tags }}"
          WORKERS="${{ github.event.inputs.workers }}"
          if [ "$TAGS" = "all" ]; then
            npx playwright test --workers="$WORKERS" --reporter=github,html
          else
            npx playwright test --workers="$WORKERS" --reporter=github,html --grep "$TAGS"
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: ${{ fromJSON(github.event.inputs.retention_days) }}
