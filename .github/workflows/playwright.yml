name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'No of parallel test runs'
        required: true
        default: '2'
        type: string
      tags:
        description: 'Tags'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '@smoke'
          - '@regression'
      base_url:
        description: 'Dashboard URL'
        required: true
        default: 'https://www.saucedemo.com'
        type: choice
        options:
          - 'https://www.saucedemo.com'
          - 'https://www.saucedemo.com'
      retention_days:
        description: 'Report retention (days)'
        required: true
        default: '1'
        type: string

jobs:
  test:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          TAGS="${{ github.event.inputs.tags }}"
          if [ "$TAGS" = "all" ]; then
            npx playwright test --workers=${{ github.event.inputs.workers }}
          else
            npx playwright test --workers=${{ github.event.inputs.workers }} --grep "$TAGS"
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: ${{ github.event.inputs.retention_days }}
